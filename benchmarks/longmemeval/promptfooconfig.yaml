# LongMemEval × Lynage × Promptfoo
#
# This config works with the Node.js API (eval.ts).
# For CLI usage: npx promptfoo eval -c benchmarks/longmemeval/promptfooconfig.yaml
#
# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: "Lynage Memory on LongMemEval benchmark"

prompts:
  - |
    你是一个能访问对话历史的AI助手。基于提供的对话历史回答问题。
    如果历史中没有包含答案，诚实地说"对话历史中没有相关信息"。
    不要猜测或使用外部知识。

    问题：{{query}}

providers:
  - id: file://./lynageProvider.cjs
    label: "Lynage Memory (DeepSeek V4 Flash)"
    config:
      dbPath: "{{dbPath}}"
      sessionId: "longmemeval-s1"

defaultTest:
  assert:
    - type: llm-rubric
      value: |
        评估回答是否与参考答案一致。

        参考答案: "{{expected}}"

        判断标准：
        - 回答包含与参考答案相同的关键事实 → 通过
        - 回答声称"不知道"但答案明确存在 → 不通过
        - 回答编造了不存在的事实 → 不通过
        - 对于需要弃权的问题（答案应为"不知道"），如果回答正确表示不知道 → 通过
      provider: openai:gpt-4.1

tests: file://./tests-generated.json
